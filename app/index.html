<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Verifika Pro</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon-180.png">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- The portal (Google Apps Script web app) shown under verifika.pro (D-68). Links from e-mails (?page=login&t=…, ?page=invite…, ?page=pass…,
     ?page=signup…) and site buttons (?page=join&kind=…) are passed on to the portal; one-time tokens are then removed from the address bar.
     The portal checks that it is framed by this site only (frameOrigins). -->
<iframe id="portal" title="Verifika Pro" allow="clipboard-write"></iframe>
<script src="config.js"></script>
<script>
  (function () {
    var src = window.VERIFIKA_PORTAL_URL + (location.search || '');
    document.getElementById('portal').src = src;
    if (/[?&]t=/.test(location.search) && window.history && history.replaceState) history.replaceState(null, '', location.pathname);
  })();
</script>
</body>
</html>
